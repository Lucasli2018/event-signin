<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>活动报名</title>
<link rel="stylesheet" href="/css/style.css">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/favicon.svg">
<meta name="theme-color" content="#FF7A45">
<!--og-meta-->
</head>
<body>
<div class="container">
  <div class="card" id="eventCard" style="display:none">
    <h2 id="evName"></h2>
    <div class="meta-row"><span class="icon">🕐</span><span id="evTime"></span></div>
    <div class="meta-row" id="evLocRow" style="display:none"><span class="icon">📍</span><span id="evLoc"></span></div>
    <div class="meta-row" id="evDescRow" style="display:none"><span class="icon">📝</span><span id="evDesc" style="white-space:pre-wrap"></span></div>
    <div class="progress-wrap">
      <div class="progress-bar"><div class="fill" id="fill"></div></div>
      <div class="progress-text"><span id="takenText"></span><span id="remainText"></span></div>
    </div>
    <div class="actions">
      <button class="btn small coral" id="btnPoster">📣 生成分享海报</button>
    </div>
  </div>

  <div class="card" id="formCard" style="display:none">
    <h2>填写报名信息</h2>
    <div class="msg" id="msg"></div>
    <div class="field">
      <label>姓名 *</label>
      <input id="fName" maxlength="30" placeholder="你的称呼">
    </div>
    <div class="field">
      <label>手机号 *</label>
      <input id="fPhone" type="tel" maxlength="20" placeholder="用于签到核对，同号仅可报一次">
    </div>
    <div id="extraFields"></div>
    <button class="btn" id="btnSignup">立即报名</button>
  </div>

  <div class="card hidden" id="successCard">
    <h2>✅ 报名成功</h2>
    <p style="font-size:14px;color:var(--muted)" id="dupTip">
      活动现场出示下方二维码，由组织者扫码签到。<b>建议截图保存本页。</b>
    </p>
    <div class="qr-box">
      <div id="qrcode"></div>
      <div class="qr-tip" id="qrName"></div>
      <div class="token-text" id="tokenText"></div>
    </div>
  </div>

  <div class="card hidden" id="closedCard">
    <h2>😅 报名通道已关闭</h2>
    <p style="font-size:14px;color:var(--muted)" id="closedReason">名额已满或报名已截止。</p>
  </div>

  <div class="empty hidden" id="notFound">活动不存在或已删除</div>

  <div class="footer">活动报名签到 · Cloudflare Pages + D1</div>
</div>

<script src="/vendor/qrcode.min.js"></script>
<script src="/js/api.js"></script>
<script src="/js/poster.js"></script>
<script src="/js/signup.js"></script>
</body>
</html>
