# Cloudflare Pages 配置
# 本地开发：wrangler pages dev public --port 8788
# 部署：wrangler pages deploy public --project-name=event-signin

name = "event-signin"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

# D1 绑定（后端 env.DB）。
[[d1_databases]]
binding = "DB"
database_name = "event-signin-db"
database_id = "11405d6f-4f4a-4927-893b-29cbc0549478"
