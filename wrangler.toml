# Cloudflare Pages 配置
# 本地开发：wrangler pages dev public --port 8788
# 部署：wrangler pages deploy public --project-name=event-signin

name = "event-signin"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

# D1 绑定（后端 env.DB）。共享 dev 库，所有表带 es_ 前缀避免与其他项目冲突。
[[d1_databases]]
binding = "DB"
database_name = "dev"
database_id = "3c83aee3-4645-450b-b50b-6488750deeb4"
