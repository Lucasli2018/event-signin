# Cloudflare Pages 配置
# 本地开发：wrangler pages dev public --port 8788
# 部署：wrangler pages deploy public --project-name=event-signin

name = "event-signin"
pages_build_output_dir = "public"
compatibility_date = "2025-06-01"

# D1 绑定（后端 env.DB）。首次部署前在 Dashboard 创建 D1 数据库并填入 database_id。
[[d1_databases]]
binding = "DB"
database_name = "event-signin-db"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"
